[project]
name = "knowlege-base"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.12.0",
    "fastapi>=0.142.2",
    "grandalf>=0.8",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "minio>=7.2.20",
    "numpy>=2.4.6",
    "pymongo>=4.18.2",
    "python-dotenv>=1.2.4",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
    "flagembedding>=1.3.5",
    "transformers>=4.45.0,<5.0.0",
    "pymilvus[model]>=3.0.2",
    "modelscope>=1.40.2",
    "openai-agents>=0.17.2",
    "dashscope>=1.25.18",
    "uvicorn[standard]>=0.47.0",
    "logger>=1.4",
    "path>=17.1.1",
    "python-multipart",
]

[tool.uv.sources]
# 强制从 NVIDIA 源安装
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
